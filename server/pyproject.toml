[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nav"
version = "0.1.0"
requires-python = ">=3.12"
description = "Turns a depth stream from any sensor into a planned walking path for a display to show."
dependencies = [
    "numpy",
    # OpenCV 5 dropped cv2.undistortPointsIter, which nav/sources/camera_model.py calls to undistort
    # the glasses' gaze and edge points. A fresh install picks up 5.0 otherwise, and 27 tests fail.
    "opencv-python>=4.11,<5",
    "open3d>=0.19",
    # The planner's contact term needs the log of the normal cumulative distribution, accurate at
    # both tails. numpy has no erf, and scipy.special.log_ndtr is that function exactly.
    "scipy",
]

[project.optional-dependencies]
# depth-anything-3 declares numpy<2 and pulls open3d and opencv-python of its own, so installing
# this extra pins the whole environment to numpy 1.x. Not restated as a pin here, because the
# constraint belongs to that package and a copy of it here would drift.
glasses = [
    "torch",
    "depth-anything-3",
    # depth-anything-3 0.1.1 imports addict in its model module and does not declare it, so a
    # clean install fails on the first model load. Declared here until their wheel does.
    "addict",
    # Pinned to the minor version the receiver was written against. nav/sources/neon_stream.py
    # relies on RTSPRawStreamer.receive, sprop_parameter_set_payloads, extract_payload_from_nal_unit,
    # SDPDataNotAvailableError, TimeOffsetEstimator, the device module's aiohttp and DeviceError, and
    # neon_live.py on MatchedItem.frame. None of those are promised to stay put across versions.
    "pupil-labs-realtime-api>=1.9,<1.10",
    # Pinned to the minor version the recording reader was written against. nav/sources/neon_recording.py
    # relies on NeonRecording and its nested SensorError, calibration.scene_camera_matrix and
    # scene_distortion_coefficients, scene[i].rgb, the imu and gaze timeseries with their time,
    # rotation and point fields, and Timeseries.sample. None of those are promised to stay put.
    "pupil-labs-neon-recording>=2.1,<2.2",
]
web = [
    "aiohttp",
]
# No test imports torch, depth_anything_3 or pupil_labs. Every estimator test uses a stub, and the
# Neon check is a script run by hand. Leaving glasses out keeps those three genuinely absent from
# the environment the suite runs in, which is the whole reason the layering test exists. web stays
# because test_web_sink.py starts a real server and connects a client to it.
# Working on the estimator means installing ".[dev,glasses]".
dev = [
    "pytest",
    "nav[web]",
]

[project.scripts]
nav = "nav.main:main"

[tool.setuptools.packages.find]
include = ["nav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs prints the reason for every skip, so a hardware-gated test that quietly stopped running
# is visible in the summary rather than looking like a pass.
addopts = "-rs"
